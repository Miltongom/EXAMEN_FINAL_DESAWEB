<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UMG - Sistema de Mensajería</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="login-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h2 class="mt-3">Chat UMG</h2>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Ej: mgomezm46" required>
                        <span class="input-group-text">@miumg.edu.gt</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="alert alert-danger d-none" id="loginError" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span id="loginErrorMsg"></span>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <span id="loginBtnText">Iniciar Sesión</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Milton Gómez - Desarrollo Web</small>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="d-none">
        <!-- Navbar -->
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">
                    <i class="bi bi-chat-dots-fill"></i> Chat UMG
                </span>
                <div class="d-flex align-items-center">
                    <div class="user-profile me-3">
                        <div class="user-avatar">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <span class="text-white ms-2" id="currentUser"></span>
                    </div>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </nav>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando mensajes...</span>
                    </div>
                    <p class="mt-2 text-muted">Cargando mensajes...</p>
                </div>
            </div>

            <!-- Message Input -->
            <div class="message-input-container">
                <div class="container">
                    <form id="messageForm" class="d-flex gap-2">
                        <input
                            type="text"
                            class="form-control"
                            id="messageInput"
                            placeholder="Escribe un mensaje..."
                            required
                            autocomplete="off"
                        >
                        <button type="submit" class="btn btn-primary" id="sendBtn">
                            <i class="bi bi-send-fill"></i> Enviar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
